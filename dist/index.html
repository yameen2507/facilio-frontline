<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontline</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #fafbfc;
        --line: #e4e6ea;
        --line-soft: #eef0f3;
        --ink: #14161a;
        --ink-2: #5b6472;
        --ink-3: #8a919e;
        --brand: #1f5fd6;
        --brand-soft: #eaf1fe;
        --hot: #c0362c;
        --hot-soft: #fdecea;
        --warm: #9a5b00;
        --warm-soft: #fdf3e3;
        --good: #12703a;
        --good-soft: #e7f5ec;
        --r: 10px;
        --shadow: 0 1px 2px rgba(20, 22, 26, 0.05), 0 4px 12px rgba(20, 22, 26, 0.04);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --surface: #191c22;
          --surface-2: #1f232a;
          --line: #2c313a;
          --line-soft: #24282f;
          --ink: #e9ecf1;
          --ink-2: #a3abb8;
          --ink-3: #7b8391;
          --brand: #6b9bff;
          --brand-soft: #1b2740;
          --hot: #ff8078;
          --hot-soft: #3a1f1d;
          --warm: #e0a441;
          --warm-soft: #34290f;
          --good: #58cd87;
          --good-soft: #14301f;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; }

      /* ---------- shell ---------- */
      .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
      aside {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand { display: flex; align-items: center; gap: 9px; padding: 0 6px; }
      .brand .mark {
        width: 26px; height: 26px; border-radius: 7px;
        background: var(--brand); color: #fff;
        display: grid; place-items: center; font-weight: 700; font-size: 14px;
      }
      .brand b { font-size: 15px; letter-spacing: -0.01em; }
      nav { display: flex; flex-direction: column; gap: 2px; }
      .nav-label {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--ink-3); padding: 10px 8px 4px; font-weight: 600;
      }
      nav a {
        display: flex; align-items: center; gap: 9px;
        padding: 7px 9px; border-radius: 7px;
        color: var(--ink-2); text-decoration: none; font-size: 13.5px;
      }
      nav a:hover { background: var(--surface-2); color: var(--ink); }
      nav a.on { background: var(--brand-soft); color: var(--brand); font-weight: 550; }
      nav a .ct { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
      nav a.on .ct { color: var(--brand); }
      aside .foot { margin-top: auto; font-size: 11.5px; color: var(--ink-3); padding: 0 8px; }
      aside .foot b { color: var(--ink-2); font-weight: 550; }

      /* ---------- page ---------- */
      main { min-width: 0; display: flex; flex-direction: column; }
      .top {
        display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        padding: 18px 24px 14px;
      }
      .top h1 { margin: 0; font-size: 19px; letter-spacing: -0.015em; }
      .top .sub { color: var(--ink-3); font-size: 13px; }
      .top .grow { flex: 1; }
      .content { padding: 0 24px 40px; min-width: 0; }

      .tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
      .tabs button {
        border: 0; background: none; color: var(--ink-2);
        padding: 8px 11px; font-size: 13px; border-bottom: 2px solid transparent;
      }
      .tabs button:hover { color: var(--ink); }
      .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 550; }
      .tabs button .n {
        font-size: 11px; color: var(--ink-3); margin-left: 5px;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- lead list ---------- */
      .lead-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 96px 84px 120px;
        gap: 12px; align-items: center;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line-soft);
        cursor: pointer;
      }
      .lead-row:hover { background: var(--surface); }
      .lead-row.on { background: var(--brand-soft); }
      .lead-row .co { font-weight: 550; letter-spacing: -0.005em; }
      .lead-row .meta { color: var(--ink-3); font-size: 12px; margin-top: 1px; }
      .lead-row .meta code { font-family: var(--mono); font-size: 11.5px; }

      .chip {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 2px 8px; border-radius: 99px;
        font-size: 11.5px; font-weight: 550; white-space: nowrap;
        background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
      }
      .chip.hot { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
      .chip.warm { background: var(--warm-soft); color: var(--warm); border-color: transparent; }
      .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
      .chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

      .score { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
      .score small { font-weight: 400; color: var(--ink-3); font-size: 11px; display: block; }

      /* ---------- cards ---------- */
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--r); box-shadow: var(--shadow);
      }
      .card > header {
        padding: 11px 15px; border-bottom: 1px solid var(--line-soft);
        display: flex; align-items: center; gap: 9px;
      }
      .card > header h3 {
        margin: 0; font-size: 11.5px; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--ink-3); font-weight: 650;
      }
      .card > header .grow { flex: 1; }
      .card .in { padding: 15px; }
      .stack { display: flex; flex-direction: column; gap: 14px; }
      .split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
      @media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }

      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
      .facts dt { font-size: 11.5px; color: var(--ink-3); margin-bottom: 1px; }
      .facts dd { margin: 0; font-size: 13.5px; }
      .facts a { color: var(--brand); text-decoration: none; }

      .bar { display: flex; gap: 7px; flex-wrap: wrap; }
      .btn {
        border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); padding: 7px 12px; border-radius: 7px; font-size: 13px;
      }
      .btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
      .btn.pri:hover:not(:disabled) { filter: brightness(1.1); color: #fff; }
      .btn.sm { padding: 4px 9px; font-size: 12px; }

      /* ---------- AI card ---------- */
      .verdict { display: flex; align-items: center; gap: 14px; margin-bottom: 13px; }
      .verdict .big { font-size: 30px; font-weight: 680; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
      .verdict .of { color: var(--ink-3); font-size: 12px; }
      .reasons { margin: 0; padding-left: 17px; font-size: 13px; color: var(--ink-2); }
      .reasons li { margin: 3px 0; }
      .sec-t { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 650; margin: 14px 0 5px; }

      /* ---------- timeline ---------- */
      .tl { list-style: none; margin: 0; padding: 0; }
      .tl li { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--line-soft); }
      .tl li:last-child { border: 0; }
      .tl .when { color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
      .tl .what { min-width: 0; }
      .tl .kind { font-family: var(--mono); font-size: 11px; color: var(--brand); }
      .tl .body { font-size: 13px; color: var(--ink-2); }

      /* ---------- chat ---------- */
      .chat-shell { max-width: 620px; margin: 0 auto; }
      .chat-foot {
        display: flex; align-items: center; gap: 12px; justify-content: space-between;
        margin-top: 11px; font-size: 12px; color: var(--ink-3);
      }
      .sys {
        align-self: center; text-align: center; font-size: 12px; color: var(--good);
        background: var(--good-soft); padding: 7px 13px; border-radius: 99px;
      }
      .chat { display: flex; flex-direction: column; height: 68vh; min-height: 420px; }
      .chat .site {
        padding: 9px 15px; border-bottom: 1px solid var(--line-soft);
        font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px;
      }
      .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; }
      .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
      .msg.a { background: var(--surface-2); border: 1px solid var(--line-soft); border-bottom-left-radius: 5px; align-self: flex-start; }
      .msg.v { background: var(--brand); color: #fff; border-bottom-right-radius: 5px; align-self: flex-end; }
      .typing { align-self: flex-start; display: flex; gap: 4px; padding: 11px 14px; }
      .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bob 1.2s infinite; }
      .typing i:nth-child(2) { animation-delay: 0.15s; }
      .typing i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bob { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
      .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line-soft); }
      .composer input {
        flex: 1; font: inherit; padding: 9px 12px; border: 1px solid var(--line);
        border-radius: 20px; background: var(--surface-2); color: var(--ink);
      }
      .composer input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
      .know dt { font-size: 11px; color: var(--ink-3); }
      .know dd { margin: 0 0 9px; font-size: 13px; }
      .know dd.none { color: var(--ink-3); font-style: italic; }
      .done { padding: 13px 15px; background: var(--good-soft); color: var(--good); font-size: 13px; border-radius: var(--r); }

      input[type="text"], input[type="number"], select, textarea {
        font: inherit; width: 100%; padding: 7px 9px;
        border: 1px solid var(--line); border-radius: 7px;
        background: var(--surface-2); color: var(--ink);
      }
      label.f { display: block; font-size: 11.5px; color: var(--ink-3); margin: 10px 0 3px; }
      /* lifecycle stepper */
      .steps { display: flex; gap: 6px; flex-wrap: wrap; }
      .step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 128px; position: relative; }
      .step i {
        width: 11px; height: 11px; border-radius: 50%; flex: none;
        border: 2px solid var(--line); background: var(--surface);
      }
      .step.done i { background: var(--good); border-color: var(--good); }
      .step.closed i { background: var(--hot); border-color: var(--hot); }
      .step.warm i { background: var(--warm); border-color: var(--warm); }
      .step b { display: block; font-size: 12.5px; font-weight: 550; }
      .step span { display: block; font-size: 11px; color: var(--ink-3); }
      .step:not(.done) b { color: var(--ink-3); font-weight: 400; }

      /* Skipped: reached past, but never happened. Distinct from not-yet-reached
         so a hollow dot on a finished lead does not read as a bug. */
      .step.skip i { border-style: dashed; border-color: var(--warm); background: transparent; }
      .step.skip b { color: var(--ink-2); font-style: italic; }
      .step.skip span { color: var(--warm); }
      .step:not(:last-child)::after {
        content: ""; position: absolute; left: 11px; right: -6px; top: 5px;
        height: 2px; background: var(--line-soft); z-index: -1;
      }

      /* response clocks */
      table.clocks { width: 100%; border-collapse: collapse; font-size: 13px; }
      table.clocks td { padding: 6px 0; border-bottom: 1px dashed var(--line-soft); }
      table.clocks tr:last-child td { border: 0; }
      table.clocks .due { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

      .empty { padding: 44px 16px; text-align: center; color: var(--ink-3); }
      .err { color: var(--hot); font-size: 13px; }
      pre.raw {
        margin: 0; padding: 11px; background: var(--surface-2); border-radius: 8px;
        font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap;
        max-height: 240px; overflow: auto; color: var(--ink-2);
      }
      .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--ink); color: var(--bg); padding: 10px 16px;
        border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
        opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20;
      }
      .toast.on { opacity: 1; }
      .toast.bad { background: var(--hot); color: #fff; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand"><span class="mark">F</span><b>Frontline</b></div>
        <nav id="nav">
          <span class="nav-label">Leads</span>
          <a href="#inbox" data-v="inbox">Lead inbox <span class="ct" id="ctInbox"></span></a>
          <a href="#accounts" data-v="accounts">Accounts</a>
          <a href="#settings" data-v="settings">Scope &amp; SLA</a>
          <span class="nav-label">Customer view</span>
          <a href="#chat" data-v="chat">Website chat</a>
        </nav>
        <div class="foot">
          <div id="me">…</div>
          <div style="margin-top: 6px"><a href="#" id="out" style="color: var(--ink-3)">Sign out</a></div>
        </div>
      </aside>

      <main>
        <div class="top">
          <h1 id="title">Inbox</h1>
          <span class="sub" id="subtitle"></span>
          <span class="grow"></span>
          <button class="btn sm" id="reload">Refresh</button>
        </div>
        <div class="content" id="view"></div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
